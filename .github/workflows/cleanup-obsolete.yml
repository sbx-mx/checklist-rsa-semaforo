name: Limpiar archivos obsoletos

on:
  workflow_dispatch:
    inputs:
      confirmar_eliminacion:
        description: "Eliminar únicamente residuos conocidos y crear commit"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cleanup-obsolete
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revisar candidatos sin borrar
        run: python tools/cleanup_obsolete.py
      - name: Eliminar lista segura
        if: ${{ inputs.confirmar_eliminacion }}
        run: python tools/cleanup_obsolete.py --apply
      - name: Registrar limpieza
        if: ${{ inputs.confirmar_eliminacion }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hay archivos obsoletos por eliminar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: eliminar archivos obsoletos conocidos"
          git push
